<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d2e">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Club de Poker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
</head>
<body>
  <nav id="nav" class="nav"></nav>
  <main id="main" class="main"><p class="muted">Cargando…</p></main>
  <script>
    // Carga siempre la última versión publicada: version.json se pide sin caché y todos los
    // archivos de la app se piden con ese número de versión (GitHub Pages los guarda 10 minutos).
    (async function () {
      var v = String(Date.now());
      try {
        var r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) v = (await r.json()).version || v;
      } catch (e) {}
      window.APP_VERSION = v;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'css/styles.css?v=' + v;
      document.head.appendChild(css);
      var mods = ['app', 'core', 'logic', 'store', 'config', 'views-public', 'views-admin', 'word'];
      var imports = {};
      mods.forEach(function (m) {
        imports[new URL('js/' + m + '.js', location.href).href] = new URL('js/' + m + '.js?v=' + v, location.href).href;
      });
      var map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports: imports });
      document.head.appendChild(map);
      import(new URL('js/app.js', location.href).href);
    })();
  </script>
</body>
</html>
