# Configuración para publicar en Render (https://render.com) como "Blueprint".
# El disco persistente guarda la base de datos y las fotos entre reinicios.
services:
  - type: web
    name: mpc-poker-club
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/version
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
    disk:
      name: mpc-data
      mountPath: /var/data
      sizeGB: 1
